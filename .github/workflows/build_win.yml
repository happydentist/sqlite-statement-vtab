name: Build Windows DLL

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 1. 檢出您的 0x09/sqlite-statement-vtab 原始碼
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 設定 MSVC 開發人員環境（x64）
    - name: Set up MSVC x64
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    # 3. 使用 vcpkg 安裝 sqlite3 標頭檔與程式庫
    - name: Install SQLite3 via vcpkg
      shell: cmd
      run: |
        vcpkg install sqlite3:x64-windows

    # 4. 在本地建立適配擴充套件的 sqlite3ext.h
    - name: Generate SQLite Extension Header
      shell: powershell
      run: |
        $macro_content = @"
        #ifndef _SQLITE3EXT_H_
        #define _SQLITE3EXT_H_
        #include <sqlite3.h>
        #ifndef SQLITE_EXTENSION_INIT1
        #define SQLITE_EXTENSION_INIT1     const sqlite3_api_routines *sqlite3_api = 0;
        #define SQLITE_EXTENSION_INIT2(v)  sqlite3_api = v;
        #endif
        #endif
        "@
        Set-Content -Path "sqlite3ext.h" -Value $macro_content

    # 5. 使用微軟 CL 編编译 Windows DLL（補上巨集與靜態連結庫路徑）
    - name: Build DLL with MSVC
      shell: cmd
      run: |
        cl /O2 /LD /D_USRDLL /D_WINDLL /DSQLITE_CORE statement_vtab.c /I. /I"C:\vcpkg\installed\x64-windows\include" /link /LIBPATH:"C:\vcpkg\installed\x64-windows\lib" sqlite3.lib /Fe:statement_vtab.dll

    # 6. 上傳編譯產物
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sqlite-statement-vtab-windows-x64
        path: statement_vtab.dll
