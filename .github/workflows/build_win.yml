name: Build Windows DLL

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 1. 檢出您的 0x09/sqlite-statement-vtab 原始碼
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 設定 MSVC 開發人員環境（這會自動把 Windows SDK 標頭檔路徑加入環境變數）
    - name: Set up MSVC x64
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    # 3. 直接編譯（使用系統內建的 SQLite 標頭檔，完全不需要手動下載）
    - name: Build DLL with MSVC
      shell: cmd
      run: |
        cl /O2 /LD /D_USRDLL /D_WINDLL statement_vtab.c /Fe:statement_vtab.dll

    # 4. 上傳編譯好的 DLL
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sqlite-statement-vtab-windows-x64
        path: statement_vtab.dll


