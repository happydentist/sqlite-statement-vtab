name: Build Windows DLL

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 1. 檢出當前 0x09/sqlite-statement-vtab 的原始碼
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 設定 MSVC x64 編譯環境
    - name: Set up MSVC x64
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    # 3. 透過 Git 直接獲取 SQLite 官方標頭檔（免除 Invoke-WebRequest 下載出錯的風險）
    - name: Get SQLite Headers via Git
      shell: powershell
      run: |
        git clone --depth 1 https://github.com sqlite_repo
        Copy-Item -Path "sqlite_repo\src\sqlite3ext.h" -Destination "."
        Copy-Item -Path "sqlite_repo\src\sqlite3.h" -Destination "."

    # 4. 使用微軟 CL 編譯器編譯符合 Windows 規範的 DLL
    - name: Build DLL with MSVC
      shell: cmd
      run: |
        cl /O2 /LD /D_USRDLL /D_WINDLL statement_vtab.c /I. /Fe:statement_vtab.dll

    # 5. 打包上傳產出的 DLL
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sqlite-statement-vtab-windows-x64
        path: statement_vtab.dll
