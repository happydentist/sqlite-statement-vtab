name: Build Windows DLL

on:
  workflow_dispatch: # 允許手動觸發

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 1. 檢出當前擴充套件的原始碼
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 設定 MSVC 開發人員命令提示字元環境（x64）
    - name: Set up MSVC x64
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    # 3. 下載並解壓縮 SQLite 標頭檔 (包含 sqlite3.h 與 sqlite3ext.h)
    - name: Download SQLite source headers
      shell: powershell
      run: |
        # 使用 2026 最新穩定版本（或依需求調整 URL 的版本號）
        $sqlite_url = "https://sqlite.org"
        Invoke-WebRequest -Uri $sqlite_url -OutFile "sqlite.zip"
        Expand-Archive -Path "sqlite.zip" -DestinationPath "sqlite_src"
        # 將解壓出來的標頭檔移到當前目錄
        Move-Item -Path "sqlite_src\sqlite-amalgamation-*\*" -Destination .

    # 4. 使用 CL 編譯器將 C 原始碼編譯為 DLL
    - name: Build DLL with MSVC
      shell: cmd
      run: |
        cl /O2 /LD statement_vtab.c /I. /Fe:statement_vtab.dll
      # 參數說明：
      # /O2 : 優化執行速度
      # /LD : 編譯為動態連結庫 (DLL)
      # /I. : 將目前目錄（有 sqlite3.h）加入標頭檔搜尋路徑
      # /Fe: : 指定輸出的檔名

    # 5. 上傳編譯好的 DLL 作為 Artifacts 供下載
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sqlite-statement-vtab-windows-x64
        path: statement_vtab.dll

