name: Build Windows DLL

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 1. 檢出您的 0x09/sqlite-statement-vtab 原始碼
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 設定 MSVC 開發人員環境
    - name: Set up MSVC x64
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    # 3. 在本地直接生成最基礎的 sqlite3ext.h，完全不需要依賴網路下載
    - name: Generate SQLite Extension Stubs
      shell: powershell
      run: |
        $macro_content = @"
        #ifndef _SQLITE3EXT_H_
        #define _SQLITE3EXT_H_
        #include <sqlite3.h>
        #ifndef SQLITE_EXTENSION_INIT1
        #define SQLITE_EXTENSION_INIT1     const sqlite3_api_routines *sqlite3_api = 0;
        #define SQLITE_EXTENSION_INIT2(v)  sqlite3_api = v;
        #endif
        #endif
        "@
        Set-Content -Path "sqlite3ext.h" -Value $macro_content

    # 4. 使用微軟 CL 編譯器編譯 Windows DLL
    - name: Build DLL with MSVC
      shell: cmd
      run: |
        cl /O2 /LD /D_USRDLL /D_WINDLL statement_vtab.c /I. /Fe:statement_vtab.dll

    # 5. 上傳編譯產物
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sqlite-statement-vtab-windows-x64
        path: statement_vtab.dll

